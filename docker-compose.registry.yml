services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: gestor_tareas_db
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  backend:
    image: ghcr.io/genacanas/backend:v0.1.0    # 👈 Se cambió build por image
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/gestor_tareas_db
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/genacanas/frontend:v0.1.0   # 👈 Se cambió build por image
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data: